# Fixed two-body solution for the FakeGame puzzle. Each list entry is one
# turn (one generate call). Turn order: Ash, Birch. The agents talk in the
# in-game text chat: Return opens it, `type` writes, Return sends.
puzzle: fake_plate_gate
agents:
  Ash:
    # Look at the plate (36.9 degrees left of the spawn heading) and walk 5 m onto it.
    - calls:
        - computer: {action: mouse_move, coordinate: [171, 384]}
        - computer: {action: hold_key, text: w, duration: 2.5}
    - calls:
        - computer:
            actions:
              - {action: key, text: Return}
              - {action: type, text: "I am standing on the plate. The gate should be open now."}
              - {action: key, text: Return}
    # Stay on the plate until Birch has the gourd.
    - calls:
        - computer: {action: wait, duration: 0.5}
    - calls:
        - end_episode: {}
  Birch:
    - calls:
        - computer: {action: hold_key, text: w, duration: 3}
    - calls:
        - computer: {action: hold_key, text: w, duration: 3}
    - calls:
        - computer: {action: left_mouse_down}
        - computer:
            actions:
              - {action: key, text: Return}
              - {action: type, text: "I have the gourd! Let's end."}
              - {action: key, text: Return}
        - end_episode: {}
