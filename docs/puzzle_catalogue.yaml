# Big Walk puzzle catalogue: every puzzle in the game, where it is, where two agents
# spawn, and whether it fits the eval. Built from the bridge survey (scripts/survey_puzzles.py)
# and the community guide at https://big-walk.net/puzzles/. See docs/PUZZLE_CATALOGUE.md.
#
# Game 1.5.1 2608271531, hosted for 2 players (the player count picks each puzzle's variant).
# Positions are Unity world coordinates. map_xz is what the in-game GPS device shows
# (GPSTracker.GetX/GetZ): x_map = 0.7071 (x + z) + 1900, z_map = 0.7071 (x - z) + 3300.
# guide_coordinates are the same numbers in the guide's order (z_map, x_map).
#
# verdict: run   - fits the eval (no sound, no simultaneous presses, players stay close).
#          maybe - fits those rules but has a practical problem (see reasons).
#          skip  - needs sound, simultaneous presses, or players far apart. Since 2026-10-02
#                  also solo, long_wait, very_long and no_gourd (the black sphere rooms).
# Spawns: Ash on the designer teleport point (TeleportPoint), Birch 1.5 m to its right,
# both at the designer's yaw. Each spawn was teleported to in the game, settled, and moved
# less than 0.1 m (2026-10-01).

