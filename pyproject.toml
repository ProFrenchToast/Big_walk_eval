[project]
name = "big-walk-eval"
version = "0.1.0"
description = "Inspect AI eval: LLM agents cooperate to solve puzzles in Big Walk"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.273",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.entry-points.inspect_ai]
big_walk_eval = "big_walk_eval._registry"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/big_walk_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
